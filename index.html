    <script>
      (function () {
        try {
          var raw = localStorage.getItem('theme');
          if (!raw) {
            var legacy = localStorage.getItem('darkmode');
            if (legacy === 'false') raw = 'light';
            else raw = 'dark';
          }
          var d = document.documentElement;
          d.classList.toggle('dark', raw !== 'light');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <script>
      // O Cloudflare Web Analytics usa Array.prototype.at. Alguns scanners e
      // WebViews antigos ainda nao oferecem a API e interrompem o beacon.
      if (!Array.prototype.at) {
        Object.defineProperty(Array.prototype, 'at', {
          configurable: true,
          writable: true,
          value: function (index) {
            var length = this.length >>> 0;
            var relativeIndex = Math.trunc(Number(index)) || 0;
            var absoluteIndex = relativeIndex < 0 ? length + relativeIndex : relativeIndex;
            return absoluteIndex < 0 || absoluteIndex >= length ? undefined : this[absoluteIndex];
          },
        });
      }
    </script>
